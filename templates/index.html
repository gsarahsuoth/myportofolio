<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    
    <!-- SITE HEADER & NAVIGATION -->
    <header class="site-header">
        <div class="container">
            <a href="#profile" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_education' %}">Education</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- HERO PROFILE SECTION -->
        <section class="hero" id="profile">
            <div class="container hero-grid">

                <!--Full Name -->
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>

                <!-- Animated Photo -->
                <div class="hero-photo">
                    <div class="avatar-block"></div>
                </div>

                <!-- Bio, Academic Data, Social Links -->
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>

                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>

                    <div class="social-links">
                        <a href="https://github.com/gsarahsuoth" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/gavrila-sarah-kartika-suoth" class="social-link">LinkedIn</a>
                        <a href="mailto:gsarahsuoth@gmail.com" class="social-link">Email</a>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- SITE FOOTER -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>

</body>
</html>
